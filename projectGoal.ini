### Edge Cases & Defensive Architecture

| Failure Scenario | Cause | Engineering Mitigation |
| --- | --- | --- |
| **GPU Throttling** | User's GPU is overloaded, extending AI latency from $400\text{ ms}$ to $800\text{ ms}$. | **Dynamic Delay Queue:** Automatically grow the video buffer size to match measured inference latency ($\Delta t$). |
| **Speaker Permutation Swap** | Speaker 1 and Speaker 2 swap volume sliders between 500 ms audio chunks. | **Voiceprint Lock:** Compute cosine similarity between the current chunk's speaker embedding and stored baseline profiles before pushing to `AudioWorklet`. |
| **Tab Context Switching** | User switches tabs, causing Chrome to throttle background frame rates. | **Offscreen Documents:** Run the WebGPU pipeline inside a Chrome Extension *Offscreen Document* to prevent CPU/GPU throttling when the tab is inactive. |
| **Audio Glitches/Popping** | Abrupt boundary cuts between 500 ms chunks. | **Overlap-Add Crossfading:** Apply an Hanning/Hamming window with a 10% overlap between consecutive audio blocks. |