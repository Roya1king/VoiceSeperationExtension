### Key Subsystems & Technical Stack

#### 1. Tab Capture & Frame Interception (`MediaStreamTrackProcessor`)

* **Role:** Intercepts raw video and audio frames from YouTube without altering the page DOM.
* **Implementation:** Use `chrome.tabCapture` combined with `MediaStreamTrackProcessor`. Video frames (`VideoFrame`) are sent to a ring buffer queue, while raw audio samples (`AudioData`) are sent to an `AudioWorklet`.

#### 2. AI Inference Engine (WebGPU + ONNX Runtime Web)

* **Role:** Runs lightweight deep learning models locally on the user's graphics card.
* **Models Required:**
* **Silero VAD:** Filters out non-speech silence/music before hitting the heavy separator (saves GPU).
* **CAM++ or ResNet34:** Extracts a 512-dimension vector (voiceprint embedding) to lock a specific speaker to a specific slider.
* **Conv-TasNet (Quantized INT8):** Performs the actual signal separation on 500 ms chunks.


* **Execution Environment:** `onnxruntime-web` with `webgpu` execution provider.

#### 3. Audio Processing & Mixing Engine (`AudioWorklet`)

* **Role:** Applies real-time volume, mute, and crossfading controls off the browser's main thread.
* **Implementation:** Custom WebAudio nodes (`GainNode` per speaker profile).

```
[ Separated Audio Chunks ] ──► [ Crossfade / Smoothing ] ──► [ GainNode: Speaker 1 ] ──┐
                                                           ──► [ GainNode: Speaker 2 ] ──┼─► Audio Destination
                                                           ──► [ GainNode: Speaker 3 ] ──┘

```

#### 4. Master Synchronization Clock

* **Role:** Keeps video and audio in lockstep despite processing delays.
* **Mechanism:** Reads the timestamp metadata (`AudioData.timestamp` and `VideoFrame.timestamp`). The video frame queue holds frames until the audio output clock (`AudioContext.currentTime`) catches up to the frame timestamp minus the hardware output latency (`AudioContext.outputLatency`).

